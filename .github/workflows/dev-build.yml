name: Dev Build & Test

on:
  workflow_dispatch:

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libegl1 libopengl0 libxcb-cursor0 libxkbcommon-x11-0

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download Model Assets
        run: |
          mkdir -p assets
          curl -L -o assets/efficientdet_lite2.tflite "https://storage.googleapis.com/mediapipe-models/object_detector/efficientdet_lite2/float32/latest/efficientdet_lite2.tflite"
          curl -L -o assets/face_recognition_sface_2021dec.onnx "https://github.com/opencv/opencv_zoo/raw/main/models/face_recognition_sface/face_recognition_sface_2021dec.onnx"

      - name: Run PyTest
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          xvfb-run pytest

  build:
    name: Build Standalone (${{ matrix.os }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate dev version
        id: gen_version
        run: |
          python scripts/generate_version.py > dev_version.txt
          echo "DEV_VERSION=$(cat dev_version.txt)" >> $GITHUB_ENV

      - name: Patch setup.py with dev version (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sed -i "s/version=\"[^\"]*\"/version=\"${DEV_VERSION}\"/" setup.py

      - name: Patch setup.py with dev version (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          (Get-Content setup.py) -replace 'version="[^"]*"', "version=\"$env:DEV_VERSION\"" | Set-Content setup.py

      - name: Download Model Assets
        run: |
          mkdir -p assets
          curl -L -o assets/efficientdet_lite2.tflite "https://storage.googleapis.com/mediapipe-models/object_detector/efficientdet_lite2/float32/latest/efficientdet_lite2.tflite"
          curl -L -o assets/face_recognition_sface_2021dec.onnx "https://github.com/opencv/opencv_zoo/raw/main/models/face_recognition_sface/face_recognition_sface_2021dec.onnx"

      - name: Build with PyInstaller
        shell: bash
        run: |
          pyinstaller safemarc.spec

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SafeMARC-${{ matrix.os == 'ubuntu-latest' && 'linux' || 'windows' }}
          path: |
            dist/SafeMARC
            dist/SafeMARC.exe
          if-no-files-found: ignore
